<style>
  :root{
    --bg:#ffffff;
    --bg-alt:#f6f8fb;
    --border:#e4e7ec;
    --text:#20242e;
    --text-muted:#697180;
    --accent:#2952cc;
    --accent-soft:#eaf0ff;
    --folder:#f0ad4e;
    --radius:8px;
  }
  html[data-theme="dark"]{
    --bg:#15171c;
    --bg-alt:#1e2129;
    --border:#2c303a;
    --text:#e7e9ee;
    --text-muted:#8a90a0;
    --accent:#6f92ff;
    --accent-soft:#232a45;
    --folder:#f0ad4e;
  }
  html{transition:background .15s;}
  body{transition:background .15s, color .15s;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}

  /* Header */
  header.top{
    position:sticky; top:0; z-index:10;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .top-inner{
    max-width:980px; margin:0 auto;
    padding:18px 24px 14px;
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(155deg,var(--accent),#5b7cf2);
    display:flex;align-items:center;justify-content:center;
    color:white;font-weight:700;font-size:15px;
    letter-spacing:-0.02em;
  }
  .brand-text h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-0.01em;}
  .brand-text p{font-size:12.5px;margin:1px 0 0;color:var(--text-muted);}

  .search-wrap{flex:1; min-width:220px; position:relative;}
  .search-wrap input{
    width:100%;
    padding:9px 14px 9px 36px;
    border:1px solid var(--border);
    border-radius:20px;
    background:var(--bg-alt);
    font-size:14px;
    color:var(--text);
    outline:none;
    transition:border-color .15s, background .15s;
  }
  .search-wrap input:focus{background:var(--bg); border-color:var(--accent);}
  .search-icon{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:15px;height:15px; color:var(--text-muted); pointer-events:none;
  }

  .view-toggle{display:flex; gap:2px; background:var(--bg-alt); border-radius:8px; padding:2px; flex-shrink:0;}
  .view-toggle button{
    border:none; background:transparent; padding:6px 9px; border-radius:6px;
    cursor:pointer; color:var(--text-muted); display:flex; align-items:center;
  }
  .view-toggle button.active{background:var(--bg); color:var(--accent); box-shadow:0 1px 2px rgba(20,30,60,.08);}
  .view-toggle svg{width:16px;height:16px;}

  .theme-toggle{
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:8px; flex-shrink:0;
    border:1px solid var(--border); background:var(--bg-alt);
    color:var(--text-muted); cursor:pointer;
  }
  .theme-toggle:hover{color:var(--accent); border-color:var(--accent);}
  .theme-toggle svg{width:17px;height:17px;}
  .theme-toggle .sun{display:none;}
  html[data-theme="dark"] .theme-toggle .sun{display:block;}
  html[data-theme="dark"] .theme-toggle .moon{display:none;}

  /* Breadcrumb + toolbar */
  .toolbar{
    max-width:980px; margin:0 auto; padding:14px 24px 4px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .crumbs{display:flex; align-items:center; flex-wrap:wrap; gap:4px; font-size:14px; color:var(--text-muted);}
  .crumbs button{
    background:none;border:none;font:inherit;cursor:pointer;color:var(--text-muted);
    padding:4px 6px; border-radius:6px;
  }
  .crumbs button:hover{background:var(--bg-alt); color:var(--text);}
  .crumbs .current{color:var(--text); font-weight:600;}
  .crumbs .sep{color:#c4c9d4;}
  .count-label{font-size:12.5px; color:var(--text-muted); white-space:nowrap;}

  main{max-width:980px; margin:0 auto; padding:6px 24px 60px;}

  /* List view */
  .list{border-top:1px solid var(--border);}
  .row{
    display:flex; align-items:center; gap:14px;
    padding:11px 6px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    transition:background .1s;
  }
  .row:hover{background:var(--bg-alt);}
  .row .icon{
    width:34px;height:34px;border-radius:8px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .row .icon svg{width:19px;height:19px;}
  .row .name{flex:1; min-width:0;}
  .row .name .n{font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .name .p{font-size:12px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px;}
  .row .badge{
    font-size:11px; color:var(--text-muted); background:var(--bg-alt);
    border:1px solid var(--border); border-radius:5px; padding:2px 7px;
    flex-shrink:0; text-transform:uppercase; letter-spacing:.02em;
  }
  .row .dl{
    flex-shrink:0; width:30px;height:30px;border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-muted); opacity:0;
    transition:opacity .12s, background .12s, color .12s;
  }
  .row:hover .dl{opacity:1;}
  .row .dl:hover{background:var(--accent-soft); color:var(--accent);}
  .row .dl svg{width:16px;height:16px;}
  .row .chev{width:16px;height:16px;color:#c4c9d4;flex-shrink:0;}

  /* Grid view */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px; padding:14px 0;
  }
  .card{
    border:1px solid var(--border); border-radius:12px; padding:16px 12px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    cursor:pointer; text-align:center; transition:box-shadow .12s, border-color .12s;
  }
  .card:hover{box-shadow:0 3px 14px rgba(20,30,60,.08); border-color:#d4d9e2;}
  .card .icon{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;}
  .card .icon svg{width:24px;height:24px;}
  .card .n{font-size:12.5px; font-weight:500; line-height:1.35; word-break:break-word;}
  .card .meta{font-size:10.5px; color:var(--text-muted);}

  .empty{padding:60px 20px; text-align:center; color:var(--text-muted);}
  .empty svg{width:40px;height:40px;margin-bottom:10px;opacity:.5;}
  .empty p{font-size:14px; margin:0;}

  footer{max-width:980px; margin:0 auto; padding:10px 24px 36px; font-size:12px; color:var(--text-muted); border-top:1px solid var(--border);}
  footer a{color:var(--accent); text-decoration:none;}
  footer a:hover{text-decoration:underline;}

  /* Modale d'aperçu PDF */
  .pdf-modal{
    display:none; position:fixed; inset:0; z-index:100;
    background:rgba(20,22,28,.82);
    flex-direction:column;
  }
  .pdf-modal.open{display:flex;}
  .pdf-modal-bar{
    flex-shrink:0; height:52px; display:flex; align-items:center; gap:10px;
    padding:0 14px; background:var(--bg); border-bottom:1px solid var(--border);
  }
  .pdf-modal-title{
    flex:1; font-size:13.5px; font-weight:500; color:var(--text);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .pdf-modal-btn{
    width:32px;height:32px;border-radius:7px;border:none;background:transparent;
    display:flex;align-items:center;justify-content:center;color:var(--text-muted);
    cursor:pointer; flex-shrink:0;
  }
  .pdf-modal-btn:hover{background:var(--bg-alt); color:var(--accent);}
  .pdf-modal-btn svg{width:18px;height:18px;}
  #pdfFrame{flex:1; width:100%; border:none; background:#525659;}

  @media (max-width:560px){
    .top-inner{padding:14px 16px 10px;}
    .toolbar{padding:12px 16px 4px;}
    main{padding:6px 16px 50px;}
    .brand-text p{display:none;}
    footer{padding:10px 16px 30px;}
  }
</style>
</head>

  const ext = filename.split('.').pop().toLowerCase();
  return TYPES[ext] || {icon:'file', color:'#6b6f7a', bg:'#eef0f3', label:ext.toUpperCase()};
}

/* ---------- état ---------- */
let path = [];       // ex: ["Mathématiques","Cours"]
let view = 'list';
let query = '';

function getNode(p){
  let node = MANIFEST;
  for(const seg of p){
    node = node.children.find(c => c.name === seg);
    if(!node) return null;
  }
  return node;
}

function folderStats(node){
  let files=0, folders=0;
  for(const c of node.children){
    if(c.type==='folder'){ folders++; const s=folderStats(c); files+=s.files; folders+=s.folders; }
    else files++;
  }
  return {files, folders};
}

function searchAll(q){
  const results = [];
  const lower = q.toLowerCase();
  function walk(node, trail){
    for(const c of node.children){
      if(c.name.toLowerCase().includes(lower)){
        results.push({node:c, trail});
      }
      if(c.type==='folder') walk(c, [...trail, c.name]);
    }
  }
  walk(MANIFEST, []);
  return results;
}

function encodePath(p){
  return p.map(encodeURIComponent).join('/');
}

/* Construit les 2 variantes d'URL possibles (NFC / NFD) pour gérer
   les différences d'encodage Unicode des accents entre OS. */
function buildHrefVariants(trailPath, name){
  const segs = [...trailPath, name];
  const nfc = 'data/' + segs.map(s => encodeURIComponent(s.normalize('NFC'))).join('/');
  const nfd = 'data/' + segs.map(s => encodeURIComponent(s.normalize('NFD'))).join('/');
  return nfc === nfd ? [nfc] : [nfc, nfd];
}

/* Trouve la première URL qui existe vraiment (gère NFC/NFD). */
async function resolveFileUrl(trailPath, name){
  const variants = buildHrefVariants(trailPath, name);
  for(const url of variants){
    try{
      const res = await fetch(url, {method:'HEAD'});
      if(res.ok) return url;
    }catch(e){ /* essaie la variante suivante */ }
  }
  return variants[0]; // dernier recours si HEAD n'est pas fiable
}

async function openFile(trailPath, name){
  const url = await resolveFileUrl(trailPath, name);
  window.location.href = url;
}

/* ---------- aperçu PDF (modale) ---------- */
const pdfModal = document.getElementById('pdfModal');
const pdfFrame = document.getElementById('pdfFrame');
const pdfTitle = document.getElementById('pdfTitle');
const pdfDownload = document.getElementById('pdfDownload');

async function previewPdf(trailPath, name){
  const url = await resolveFileUrl(trailPath, name);
  pdfTitle.textContent = name;
  pdfDownload.href = url;
  pdfFrame.src = url;
  pdfModal.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closePdfModal(){
  pdfModal.classList.remove('open');
  pdfFrame.src = '';
  document.body.style.overflow = '';
}
document.getElementById('pdfClose').addEventListener('click', closePdfModal);
pdfModal.addEventListener('click', (e) => { if(e.target === pdfModal) closePdfModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closePdfModal(); });

/* Ouvre en aperçu si c'est un PDF, sinon télécharge directement. */
function handleFileOpen(trailPath, name){
  const ext = name.split('.').pop().toLowerCase();
  if(ext === 'pdf'){ previewPdf(trailPath, name); }
  else { openFile(trailPath, name); }
}

/* ---------- rendu ---------- */
const crumbsEl = document.getElementById('crumbs');
const contentEl = document.getElementById('content');
const countEl = document.getElementById('countLabel');

function renderCrumbs(){
  crumbsEl.innerHTML = '';
  const home = document.createElement('button');
  home.textContent = 'Accueil';
  home.onclick = () => { path = []; query=''; document.getElementById('search').value=''; render(); };
  if(path.length===0) home.className='current';
  crumbsEl.appendChild(home);

  path.forEach((seg, i) => {
    const sep = document.createElement('span');
    sep.className='sep'; sep.textContent='/';
    crumbsEl.appendChild(sep);
    const btn = document.createElement('button');
    btn.textContent = seg;
    if(i === path.length-1) btn.className='current';
    btn.onclick = () => { path = path.slice(0, i+1); render(); };
    crumbsEl.appendChild(btn);
  });
}

function iconHTML(type, colorBg, color){
  return `<div class="icon" style="background:${colorBg};color:${color}">${ICONS[type]}</div>`;
}

function rowFolder(node, trailPath){
  const stats = folderStats(node);
  const el = document.createElement('div');
  el.className='row';
  el.innerHTML = `
    ${iconHTML('folder', '#fdf1de', '#c9861f')}
    <div class="name">
      <div class="n">${node.name}</div>
      <div class="p">${stats.folders} dossier${stats.folders!==1?'s':''} · ${stats.files} fichier${stats.files!==1?'s':''}</div>
    </div>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 6 15 12 9 18"/></svg>
  `;
  el.onclick = () => { path = trailPath; query=''; document.getElementById('search').value=''; render(); };
  return el;
}

function rowFile(node, trailPath){
  const t = typeFor(node.name);
  const el = document.createElement('div');
  el.className='row';
  el.innerHTML = `
    ${iconHTML(t.icon, t.bg, t.color)}
    <div class="name"><div class="n">${node.name}</div></div>
    <div class="badge">${t.label}</div>
    <button class="dl" title="Télécharger" onclick="event.stopPropagation()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M5 21h14"/></svg>
    </button>
  `;
  el.querySelector('.dl').addEventListener('click', () => openFile(trailPath, node.name));
  el.onclick = (e) => { if(e.target.closest('.dl')) return; handleFileOpen(trailPath, node.name); };
  return el;
}

function cardFolder(node, trailPath){
  const stats = folderStats(node);
  const el = document.createElement('div');
  el.className='card';
  el.innerHTML = `
    <div class="icon" style="width:46px;height:46px;background:#fdf1de;color:#c9861f;border-radius:11px;">${ICONS.folder}</div>
    <div class="n">${node.name}</div>
    <div class="meta">${stats.files} fichier${stats.files!==1?'s':''}</div>
  `;
  el.onclick = () => { path = trailPath; query=''; document.getElementById('search').value=''; render(); };
  return el;
}

function cardFile(node, trailPath){
  const t = typeFor(node.name);
  const el = document.createElement('div');
  el.className='card';
  el.innerHTML = `
    <div class="icon" style="width:46px;height:46px;background:${t.bg};color:${t.color};border-radius:11px;">${ICONS[t.icon]}</div>
    <div class="n">${node.name}</div>
    <div class="meta">${t.label}</div>
  `;
  el.onclick = () => handleFileOpen(trailPath, node.name);
  return el;
}

function emptyState(msg){
  const el = document.createElement('div');
  el.className='empty';
  el.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <p>${msg}</p>`;
  return el;
}

function render(){
  renderCrumbs();
  contentEl.innerHTML = '';

  if(query.trim().length > 0){
    const results = searchAll(query.trim());
    countEl.textContent = `${results.length} résultat${results.length!==1?'s':''}`;
    if(results.length === 0){
      contentEl.appendChild(emptyState('Aucun résultat pour cette recherche.'));
      return;
    }
    const wrap = document.createElement('div'); wrap.className = view==='grid' ? 'grid' : 'list';
    results.forEach(({node, trail}) => {
      let rowEl;
      if(view==='grid'){
        rowEl = node.type==='folder' ? cardFolder(node, [...trail, node.name]) : cardFile(node, trail);
      } else {
        rowEl = node.type==='folder' ? rowFolder(node, [...trail, node.name]) : rowFile(node, trail);
        // show path hint under name for search results
        const p = rowEl.querySelector('.name');
        if(p && trail.length){
          const hint = document.createElement('div');
          hint.className='p'; hint.textContent = trail.join(' / ');
          p.appendChild(hint);
        }
      }
      wrap.appendChild(rowEl);
    });
    contentEl.appendChild(wrap);
    return;
  }

  const node = getNode(path);
  if(!node){ path = []; return render(); }
  const stats = folderStats(node);
  countEl.textContent = `${stats.folders} dossier${stats.folders!==1?'s':''} · ${stats.files} fichier${stats.files!==1?'s':''}`;

  if(node.children.length === 0){
    contentEl.appendChild(emptyState('Ce dossier est vide.'));
    return;
  }

  const wrap = document.createElement('div'); wrap.className = view==='grid' ? 'grid' : 'list';
  node.children.forEach(c => {
    const trail = [...path, c.name];
    let el;
    if(view==='grid'){
      el = c.type==='folder' ? cardFolder(c, trail) : cardFile(c, path);
    } else {
      el = c.type==='folder' ? rowFolder(c, trail) : rowFile(c, path);
    }
    wrap.appendChild(el);
  });
  contentEl.appendChild(wrap);
}

/* ---------- events ---------- */
document.getElementById('search').addEventListener('input', (e) => {
  query = e.target.value;
  render();
});
document.getElementById('viewToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  view = btn.dataset.view;
  [...document.getElementById('viewToggle').children].forEach(b => b.classList.toggle('active', b===btn));
  render();
});

/* ---------- thème clair / sombre ---------- */
const themeToggle = document.getElementById('themeToggle');
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme')
  || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
applyTheme(savedTheme);
themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(current);
});

render();
</script>
</body>
</html>
